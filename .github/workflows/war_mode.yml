name: "⚔️ Coercion Files — 30 Day Monetization War Plan"

on:
  # V2.5.1: schedules consolidated into daily_pipeline (4 windows).
  # War Mode stays manual-only to avoid duplicate runs / wasted CI minutes.
  workflow_dispatch:

permissions:
  contents: write

# V2.1: serialize with the daily pipeline so both never upload at once
# (V2 had no concurrency group → possible double-posting / push races).
concurrency:
  group: cognitive-dark-writer
  cancel-in-progress: false

jobs:
  war-mode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # V2.1: cache the ~360MB Kokoro model (V2 re-downloaded it on every run,
      # ~1.4GB/day of wasted bandwidth).
      - name: Cache Kokoro model
        uses: actions/cache@v4
        with:
          path: data/models/kokoro
          key: kokoro-onnx-${{ runner.os }}-v1

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          # V2.1: add fonts-dejavu (V2 omitted it → captions/thumbnail fell
          # back to PIL's tiny default bitmap font).
          sudo apt-get install -y -qq ffmpeg fonts-dejavu espeak-ng
          python -m pip install -q --upgrade pip
          pip install -q -r requirements.txt kokoro-onnx onnxruntime

      - name: Ensure music assets
        run: |
          mkdir -p assets/music
          if ! compgen -G 'assets/music/*.wav' >/dev/null; then
            python scripts/generate_music.py
          fi

      - name: Run ML Autonomous Pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_CREDENTIALS: ${{ secrets.YOUTUBE_CREDENTIALS || secrets.YOUTUBE_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID || secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN || secrets.FB_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_USER_ID || secrets.IG_BUSINESS_ACCOUNT_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN || secrets.FACEBOOK_ACCESS_TOKEN || secrets.IG_ACCESS_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          TTS_PRIMARY: "onnx"
          KOKORO_VOICE: "am_fenrir"
          KOKORO_MODEL_DIR: "data/models/kokoro"
          WAR_MODE: "true"
        run: python src/main.py

      - name: Sync Learning Data (conflict-safe)
        if: success()
        run: |
          set -euo pipefail
          git config user.name "Coercion Files Brain"
          git config user.email "brain@coercionfiles.ai"
          # Conflicts are a hard failure; never silently overwrite remote learning state.
          git pull --no-rebase --autostash origin "$GITHUB_REF_NAME"
          if grep -lE '^(<<<<<<<|>>>>>>>)' data/*.json data/*.jsonl 2>/dev/null; then
            echo "::error::Conflict markers in data/*.json — run scripts/repair_data_files.py --apply first."
            exit 1
          fi
          for f in data/*.json; do
            python -m json.tool "$f" >/dev/null || { echo "::error::Invalid JSON: $f"; exit 1; }
          done
          git add -f data/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "🧠 ML: Daily autonomous update [skip ci]"
            git push
          fi
