name: "Coercion Files — Multi-Platform Daily Pipeline"

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "youtube,facebook,instagram"
        required: false
        type: string
      dry_run:
        description: "build only, no uploads"
        required: false
        type: boolean
        default: false
  schedule:
    # V3.7: peak-aligned 4 windows = 10:30a/12:30p/6:30p/9:30p ET
    #   (brunch scroll, lunch peak, evening peak, wind-down peak)
    #   --repeat 2 per run + MIN_POST_GAP_HOURS=3 keep ALL output inside
    #   max-activity windows (12-3p & 7-10p local = Shorts research peaks).
    - cron: "30 14 * * *"
    - cron: "30 16 * * *"
    - cron: "30 22 * * *"
    - cron: "30 1 * * *"

permissions:
  contents: write

concurrency:
  group: cognitive-dark-writer
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Kokoro model
        uses: actions/cache@v4
        with:
          path: data/models/kokoro
          key: kokoro-onnx-${{ runner.os }}-v1

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu espeak-ng

      - name: Install Python deps
        run: |
          python -m pip install -q --upgrade pip
          pip install -q -r requirements.txt kokoro-onnx onnxruntime

      - name: Ensure music assets
        run: |
          mkdir -p assets/music
          ls assets/music/*.wav 2>/dev/null || python scripts/generate_music.py || echo "Continuing without music assets"

      - name: Offline smoke test
        run: python src/main.py --selftest

      - name: Run pipeline
        env:
          # V2.1: accept BOTH secret naming schemes via || fallback so a
          # mismatch between workflows can never silently drop credentials.
          PLATFORMS: ${{ inputs.platforms || 'youtube,facebook,instagram' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_CREDENTIALS: ${{ secrets.YOUTUBE_CREDENTIALS || secrets.YOUTUBE_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID || secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN || secrets.FB_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_USER_ID || secrets.IG_BUSINESS_ACCOUNT_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN || secrets.FACEBOOK_ACCESS_TOKEN || secrets.IG_ACCESS_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          TTS_PRIMARY: "onnx"
          KOKORO_VOICE: "am_fenrir"
          # 2026-08-17: weighted voice rotation — fenrir brand voice ~60%,
          # adult pool rotates so the channel never sounds like one machine.
          VOICE_ROTATE: "auto"
          KOKORO_VOICE_POOL: "am_fenrir:60,am_adam:15,am_michael:15,af_heart:10"
          KOKORO_MODEL_DIR: "data/models/kokoro"
          # V3.5 Independent Release Gate — strict (default) = sab guards
          # + supervisor pass hona zaroori; warn = report only (emergency).
          GATE_MODE: "strict"
          GATE_MAX_REPAIRS: "2"
          # Meta safety: relevant low-volume hashtags and no engagement bait.
          META_MAX_HASHTAGS: "5"
          META_ALLOW_ENGAGEMENT_BAIT: "0"
          # V3.7: Trend-Spiker — live public-feed (Google Trends RSS + YouTube
          # trending) spike override when a genuinely hot ON-BRAND topic is
          # detected; safety filters never relax (on-brand + no duplicates +
          # 2 independent signals minimum).
          TREND_SPIKER_ENABLED: "true"
        # V2.1: no `|| echo` — a crashed pipeline must turn the run RED so it
        # is noticed, instead of reporting success while uploading nothing.
        # --repeat 2: produce 2 videos per run for daily volume consistency.
        run: python src/main.py --platforms "$PLATFORMS" --repeat 2 $([ "$DRY_RUN" = "1" ] && echo --dry-run)

      - name: Package content for manual posting
        if: always()
        run: |
          set -euo pipefail
          mkdir -p content_pack
          found=0
          while IFS= read -r -d '' video; do
            run_dir="$(dirname "$(dirname "$video")")"
            run_id="$(basename "$run_dir")"
            cp "$video" "content_pack/video_${run_id}.mp4"
            thumb="$(dirname "$video")/thumbnail.jpg"
            packages="$(dirname "$video")/seo_packages.json"
            [ -f "$thumb" ] && cp "$thumb" "content_pack/thumbnail_${run_id}.jpg"
            [ -f "$packages" ] && cp "$packages" "content_pack/seo_packages_${run_id}.json"
            found=1
          done < <(find output/runs output/dry_runs -type f -path '*/artifacts/final_video.mp4' -mmin -30 -print0 2>/dev/null)
          [ "$found" -eq 1 ] || echo "No run-scoped video artifacts found"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-content
          path: content_pack/
          retention-days: 3

      - name: Fetch real metrics & credit ML (same memory, single writer)
        if: ${{ success() }}
        env:
          # V2.1: pass YT creds here too (V2 omitted them → YT metrics never
          # synced in CI). Both naming schemes accepted.
          YOUTUBE_CREDENTIALS: ${{ secrets.YOUTUBE_CREDENTIALS || secrets.YOUTUBE_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID || secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN || secrets.FB_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_USER_ID || secrets.IG_BUSINESS_ACCOUNT_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN || secrets.FACEBOOK_ACCESS_TOKEN || secrets.IG_ACCESS_TOKEN }}
        run: python scripts/fetch_metrics.py || echo "Metrics sync completed with warnings"

      # V2.7: SINGLE commit step. The old separate `metrics-sync` job was a
      # second writer on learning_store.json — its `git pull --rebase
      # --autostash` conflicted with the build job's push, the `|| true`
      # swallowed it, and `git add -f` committed the conflict MARKERS. That
      # corrupted store → silent ML memory resets → dead post guards → the
      # "2 videos at once" double-post bug. Now: one writer, one push, and a
      # hard failure (RED run) instead of ever committing corruption.
      - name: Commit learning memory back (single writer, conflict-safe)
        run: |
          set -euo pipefail
          git config user.name "Coercion Files Bot"
          git config user.email "bot@coercionfiles.local"
          # Bring in remote changes; a conflict is a hard failure, never a silent overwrite.
          git pull --no-rebase --autostash origin "$GITHUB_REF_NAME"
          # V3.7.5: unmerged (still-conflicting) files = resolve by keeping OUR
          # freshly generated data; NEVER leave them blocking the commit.
          if [ -n "$(git ls-files --unmerged 2>/dev/null)" ]; then
            echo "::error::Unmerged paths remain after pull"
            exit 1
          fi
          # NEVER commit conflict markers or invalid JSON — corruption = RED run
          if grep -lE '^(<<<<<<<|>>>>>>>)' data/*.json data/*.jsonl 2>/dev/null; then
            echo "::error::Conflict markers in data/*.json — run scripts/repair_data_files.py --apply first."
            exit 1
          fi
          for f in data/*.json; do
            python -m json.tool "$f" >/dev/null || { echo "::error::Invalid JSON: $f"; exit 1; }
          done
          git add -f data/learning_store.json data/run_journal.json \
            data/monetization_progress.json data/metrics_report.md \
            data/*.events.jsonl data/strategy_state.json data/strategy_notes.md \
            data/health_report.md data/daily_brief.md data/reply_queue.json \
            data/engagement_report.md data/llm_state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "🤖 Update ML learning store + journal [skip ci]"
            pushed=false
            for i in 1 2 3; do
              if git push 2>/dev/null; then
                echo "✅ Learning store pushed (attempt $i)"
                pushed=true
                break
              fi
              echo "⚠️ push attempt $i failed — retrying..."
              sleep 10
            done
            [ "$pushed" = true ] || { echo "::error::All push attempts failed"; exit 1; }
          fi
