name: "🎛️ Video Manager (list / cleanup faulty uploads)"

on:
  workflow_dispatch:
    inputs:
      action:
        description: "list | keep_latest | spread | shorts_repair | ig_diagnose | audit | fb_metrics | social_list | social_cleanup"
        required: true
        type: choice
        options:
          - list
          - keep_latest
          - spread
          - shorts_repair
          - boost_existing
          - boost_report
          - engagement_audit
          - engage_comments
          - human_brief
          - check_keys
          - ig_diagnose
          - audit
          - fb_metrics
          - social_list
          - social_cleanup
        default: list
      keep_count:
        description: "how many latest uploads to keep (keep_latest only)"
        required: false
        type: string
        default: "3"
      fix_public:
        description: "shorts_repair: actually make past-due private videos public"
        required: false
        type: boolean
        default: false
      confirm_apply:
        description: "boost_existing: apply live changes only when true"
        required: false
        type: boolean
        default: false
      confirm_delete:
        description: "social_cleanup: delete only when true after reviewing the list"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: cognitive-dark-writer
  cancel-in-progress: false

jobs:
  manage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          pip install -q python-dotenv google-api-python-client google-auth-oauthlib
      - name: Run manager
        if: ${{ inputs.action == 'list' || inputs.action == 'keep_latest' || inputs.action == 'spread' }}
        env:
          YOUTUBE_CREDENTIALS: ${{ secrets.YOUTUBE_CREDENTIALS || secrets.YOUTUBE_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: python scripts/manage_uploads.py "${{ inputs.action }}" "${{ inputs.keep_count }}"

      - name: YouTube Shorts diagnostic & repair
        if: ${{ inputs.action == 'shorts_repair' }}
        env:
          YOUTUBE_CREDENTIALS: ${{ secrets.YOUTUBE_CREDENTIALS || secrets.YOUTUBE_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          python scripts/youtube_shorts_repair.py ${{ inputs.fix_public && '--fix-public' || '' }}

      - name: BOOST existing content — dry-run report
        if: ${{ inputs.action == 'boost_existing' }}
        env:
          YOUTUBE_CREDENTIALS: ${{ secrets.YOUTUBE_CREDENTIALS || secrets.YOUTUBE_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: python scripts/boost_existing.py

      - name: BOOST existing content — apply after explicit confirmation
        if: ${{ inputs.action == 'boost_existing' && inputs.confirm_apply }}
        env:
          YOUTUBE_CREDENTIALS: ${{ secrets.YOUTUBE_CREDENTIALS || secrets.YOUTUBE_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          CONFIRM_BOOST_APPLY: ${{ inputs.confirm_apply && '1' || '0' }}
        run: python scripts/boost_existing.py --apply

      - name: Existing content performance report (YT/FB/IG)
        if: ${{ inputs.action == 'boost_report' }}
        env:
          YOUTUBE_CREDENTIALS: ${{ secrets.YOUTUBE_CREDENTIALS || secrets.YOUTUBE_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID || secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN || secrets.FB_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_USER_ID || secrets.IG_BUSINESS_ACCOUNT_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN || secrets.FACEBOOK_ACCESS_TOKEN || secrets.IG_ACCESS_TOKEN }}
        run: python scripts/boost_report.py

      - name: Commit human-layer data (brief, replies) — conflict-safe
        if: ${{ inputs.action == 'engage_comments' || inputs.action == 'human_brief' }}
        run: |
          set -euo pipefail
          git config user.name "Coercion Files Brain"
          git config user.email "brain@coercionfiles.ai"
          git pull --no-rebase --autostash origin "$GITHUB_REF_NAME"
          if grep -lE '^(<<<<<<<|>>>>>>>)' data/*.json data/*.jsonl 2>/dev/null; then
            echo "::error::Conflict markers found"; exit 1
          fi
          git add -f data/daily_brief.md data/reply_queue.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "☕ Human layer: daily brief / replies [skip ci]"
            git push
          fi

      - name: Engagement doctor (zero-like alerts + ML feedback)
        if: ${{ inputs.action == 'engagement_audit' }}
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          python scripts/analyze_engagement.py

      - name: Comment engagement engine (fetch + draft human replies)
        if: ${{ inputs.action == 'engage_comments' }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID || secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN || secrets.FB_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_USER_ID || secrets.IG_BUSINESS_ACCOUNT_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN || secrets.FACEBOOK_ACCESS_TOKEN || secrets.IG_ACCESS_TOKEN }}
        run: python scripts/engage_comments.py

      - name: Daily brief (human creator notes)
        if: ${{ inputs.action == 'human_brief' }}
        env:
          CD_DATA_DIR: data
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'src')
          from human_layer import write_daily_brief
          import json
          from pathlib import Path
          ml = {}
          j = {}
          m = {}
          try:
              from ml_engine import LearningSystem
              ml = LearningSystem().data
          except Exception:
              pass
          try:
              j = json.loads(Path('data/run_journal.json').read_text())
          except Exception:
              pass
          try:
              m = json.loads(Path('data/monetization_progress.json').read_text())
          except Exception:
              pass
          p = write_daily_brief(ml_data=ml, journal=j, monetization=m)
          print(p.read_text())
          PY

      - name: LLM / API key checker (Groq, Gemini, Pexels, Pixabay)
        if: ${{ inputs.action == 'check_keys' }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python scripts/check_llm_keys.py

      - name: Instagram / Facebook diagnostic (linkage, token, scopes, app mode)
        if: ${{ inputs.action == 'ig_diagnose' }}
        env:
          FB_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID || secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN || secrets.FB_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_USER_ID || secrets.IG_BUSINESS_ACCOUNT_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN || secrets.FACEBOOK_ACCESS_TOKEN || secrets.IG_ACCESS_TOKEN }}
          FACEBOOK_APP_ID: ${{ secrets.FACEBOOK_APP_ID || secrets.META_APP_ID || secrets.FB_APP_ID }}
          FACEBOOK_APP_SECRET: ${{ secrets.FACEBOOK_APP_SECRET || secrets.META_APP_SECRET || secrets.FB_APP_SECRET }}
        run: python scripts/instagram_diagnose.py

      - name: Find the IG link (scan ALL pages under the token)
        if: ${{ inputs.action == 'ig_diagnose' }}
        env:
          FB_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN || secrets.FB_ACCESS_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN || secrets.FACEBOOK_ACCESS_TOKEN || secrets.IG_ACCESS_TOKEN }}
          USER_TOKEN: ${{ secrets.USER_TOKEN }}
        run: python scripts/find_ig_link.py

      - name: IG publish capability probe (real API test)
        if: ${{ inputs.action == 'ig_diagnose' }}
        env:
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_USER_ID || secrets.IG_BUSINESS_ACCOUNT_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN || secrets.FACEBOOK_ACCESS_TOKEN || secrets.IG_ACCESS_TOKEN }}
        run: python scripts/test_ig_upload.py

      - name: Run 3-platform audit
        if: ${{ inputs.action == 'audit' }}
        env:
          YOUTUBE_CREDENTIALS: ${{ secrets.YOUTUBE_CREDENTIALS || secrets.YOUTUBE_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID || secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN || secrets.FB_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_USER_ID || secrets.IG_BUSINESS_ACCOUNT_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN || secrets.FACEBOOK_ACCESS_TOKEN || secrets.IG_ACCESS_TOKEN }}
        run: python scripts/platform_audit.py

      - name: Facebook full metrics
        if: ${{ inputs.action == 'fb_metrics' }}
        env:
          FB_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID || secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN || secrets.FB_ACCESS_TOKEN }}
        run: python scripts/facebook_metrics.py

      - name: Social content manager (FB/IG old videos)
        if: ${{ inputs.action == 'social_list' || inputs.action == 'social_cleanup' }}
        env:
          FB_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID || secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN || secrets.FB_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_USER_ID || secrets.IG_BUSINESS_ACCOUNT_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN || secrets.FACEBOOK_ACCESS_TOKEN || secrets.IG_ACCESS_TOKEN }}
          CONFIRM_SOCIAL_DELETE: ${{ inputs.confirm_delete && '1' || '0' }}
        run: python scripts/social_manager.py "${{ inputs.action == 'social_cleanup' && 'cleanup' || 'list' }}"
