name: "🧹 FB Dedupe (remove duplicate videos)"

on:
  workflow_dispatch:
    inputs:
      confirm_delete:
        description: "CHECK this to actually DELETE duplicates (leave unchecked for dry-run report)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cognitive-dark-writer
  cancel-in-progress: false

jobs:
  dedupe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -q requests python-dotenv
      - name: Detect duplicates (dry-run)
        if: ${{ !inputs.confirm_delete }}
        env:
          FB_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID || secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN || secrets.FB_ACCESS_TOKEN }}
        run: python scripts/fb_dedupe.py
      - name: Delete duplicates
        if: ${{ inputs.confirm_delete }}
        env:
          FB_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID || secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN || secrets.FB_ACCESS_TOKEN }}
          CONFIRM_FB_DELETE: ${{ inputs.confirm_delete && '1' || '0' }}
        run: python scripts/fb_dedupe.py --apply
